[project]
name = "sam3-edge"
version = "0.1.0"
description = "SAM3 Edge Computing System for Jetson AGX Orin"
requires-python = ">=3.10,<3.12"
dependencies = []

[tool.uv.workspace]
members = ["sam3_deepstream"]

# [[tool.uv.index]]
# name = "jetson"
# url = "https://pypi.jetson-ai-lab.io/jp6/cu126"
# explicit = true

[tool.uv.sources]
# sam3 from local directory (includes trt_export.py for TensorRT support)
sam3 = { path = "./sam3", editable = true }
sam3-deepstream = { workspace = true }
# torch = { index = "jetson" }
# torchvision = { index = "jetson" }
# triton = { index = "jetson" }


[tool.ruff]
line-length = 88
target-version = "py310"

# [tool.ruff.lint]
# # Select the rule sets you want to enable. 'I' is for isort (import sorting).
# select = ["E", "F", "W", "I", "UP"]
# ignore = []


[tool.ruff.format]
quote-style = "single"

# For example, to allow `print` statements, you can ignore the T201 rule from flake8-print
# ignore = ["T201"]

# [tool.mypy]
# python_version = "3.10"
# warn_return_any = true
# warn_unused_configs = true
# ignore_missing_imports = true # Good for starting out, especially with libraries that lack stubs
# strict = true
